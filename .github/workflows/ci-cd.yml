name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------
  # 1. CI (Integración Continua): Pruebas y calidad de código
  # -----------------------------------------------------------
  ci:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Linting y sintaxis con Flake8
        run: |
          # Falla si hay errores de sintaxis o variables indefinidas
          flake8 app.py test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar pruebas unitarias con Pytest
        run: |
          pytest test_app.py -v

  # -----------------------------------------------------------
  # 2. Docker: Construcción y prueba del contenedor
  # -----------------------------------------------------------
  docker-test:
    name: Build & Smoke Test Docker
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: |
          docker build -t mi-app-docker:test .

      - name: Probar ejecución del contenedor
        run: |
          docker run -d -p 5000:5000 --name app-smoke-test mi-app-docker:test
          sleep 4
          curl --fail http://localhost:5000/ || (docker logs app-smoke-test && exit 1)

  # -----------------------------------------------------------
  # 3. CD (Despliegue / Entrega Continua): Publicación de imagen
  # -----------------------------------------------------------
  cd:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [ci, docker-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker (tags y etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
